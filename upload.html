<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Foto — FotoBlog de Jose</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="./" class="logo">Foto<span>Blog</span></a>
            <p class="tagline">Cada foto cuenta una historia del pasado</p>
            <nav class="nav-links">
                <a href="./" class="nav-link">🏠 Inicio</a>
                <a href="./roll.html" class="nav-link">🎞️ Rollos</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="upload-container">
            <h1 class="upload-title">Nueva Exposición</h1>
            <p class="upload-subtitle">Añade una foto a tu colección analógica</p>

            <div class="upload-form" id="tokenSetup">
                <div class="form-group">
                    <label for="github-token">GitHub Token</label>
                    <input type="password" id="github-token" placeholder="ghp_...">
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">Se guarda en tu navegador para futuras publicaciones</p>
                </div>
                <button type="button" class="btn" id="saveTokenBtn">Guardar y Continuar</button>
            </div>

            <div class="upload-form" id="uploadFormContent" style="display: none;">
                <div class="form-group">
                    <label>Negativo / Foto</label>
                    <div class="file-drop" id="dropZone">
                        <div class="icon">📷</div>
                        <p>Selecciona una foto para subir</p>
                    </div>
                    <input type="hidden" id="uploaded-url">
                </div>

                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" placeholder="Nombre de la exposición">
                </div>

                <div class="form-group">
                    <label for="roll-id">ID del Roll</label>
                    <input type="text" id="roll-id" placeholder="001">
                </div>

                <div class="form-group">
                    <label for="roll-name">Nombre del Roll</label>
                    <input type="text" id="roll-name" placeholder="Sanxenxo en Noviembre">
                </div>

                <div class="form-group">
                    <label for="day-number">Day #</label>
                    <input type="text" id="day-number" placeholder="001">
                </div>

                <div class="form-group">
                    <label for="photo-number">Foto #</label>
                    <input type="text" id="photo-number" placeholder="01">
                </div>

                <div class="form-group">
                    <label for="notes">Notas</label>
                    <textarea id="notes" placeholder="Notas sobre esta exposición..."></textarea>
                </div>

                <div class="form-group" id="exif-group" style="display: none;">
                    <label>Datos EXIF</label>
                    <div id="exif-display" class="exif-data"></div>
                </div>

                <button type="button" class="btn" id="submitBtn">Publicar en el Blog</button>
                <div id="uploadResult"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-seal">
            <span>FotoBlog<br>Jose · 2026</span>
        </div>
        <p class="footer-copyright">Cada foto cuenta una historia del pasado</p>
    </footer>

    <script src="//upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script>
        const CLOUD_NAME = 'dk3t3fas3';
        const UPLOAD_PRESET = 'fotoblog_unsigned';
        const GITHUB_REPO = 'polidisio/FotoBlog';
        const GITHUB_BRANCH = 'main';

        const DROPZONE = document.getElementById('dropZone');
        const UPLOADED_URL = document.getElementById('uploaded-url');
        const TITLE_INPUT = document.getElementById('title');
        const ROLL_ID = document.getElementById('roll-id');
        const DAY_NUMBER = document.getElementById('day-number');
        const PHOTO_NUMBER = document.getElementById('photo-number');
        const NOTES = document.getElementById('notes');
        const SUBMIT_BTN = document.getElementById('submitBtn');
        const RESULT = document.getElementById('uploadResult');
        const EXIF_GROUP = document.getElementById('exif-group');
        const EXIF_DISPLAY = document.getElementById('exif-display');
        const TOKEN_SETUP = document.getElementById('tokenSetup');
        const TOKEN_INPUT = document.getElementById('github-token');
        const SAVE_TOKEN_BTN = document.getElementById('saveTokenBtn');

        let extractedExif = null;

        // Check for stored token
        const storedToken = localStorage.getItem('fotoblog_github_token');
        if (storedToken) {
            TOKEN_SETUP.style.display = 'none';
            document.getElementById('uploadFormContent').style.display = 'block';
        }

        // Save token
        SAVE_TOKEN_BTN.addEventListener('click', function() {
            const token = TOKEN_INPUT.value.trim();
            if (token) {
                localStorage.setItem('fotoblog_github_token', token);
                TOKEN_SETUP.style.display = 'none';
                document.getElementById('uploadFormContent').style.display = 'block';
            }
        });

        // Open Cloudinary widget on click
        DROPZONE.addEventListener('click', function() {
            cloudinary.openUploadWidget({
                cloud_name: CLOUD_NAME,
                upload_preset: UPLOAD_PRESET,
                sources: ['local', 'camera'],
                multiple: false,
                cropping: false,
                folder: 'fotoblog',
                styles: {
                    palette: {
                        window: "#2D1B0E",
                        windowBorder: "#C4704A",
                        tabIcon: "#C4704A",
                        menuIcons: "#C4704A",
                        textDark: "#F5EDE0",
                        textLight: "#F5EDE0",
                        link: "#C4704A",
                        action: "#C4704A",
                        inactiveTabIcon: "#A89888",
                        error: "#C4704A",
                        inProgress: "#C4704A",
                        complete: "#8B9A7D",
                        sourceBg: "#1A0F08"
                    }
                }
            }, function(error, result) {
                if (error) {
                    RESULT.innerHTML = '<div class="result error"><strong>Error: ' + error.message + '</strong></div>';
                    RESULT.style.display = 'block';
                    return;
                }
                if (result && result.event === 'success') {
                    const info = result.info;
                    UPLOADED_URL.value = info.secure_url;

                    DROPZONE.querySelector('p').textContent = '✅ ¡Foto subida! ' + info.original_filename;
                    DROPZONE.style.borderColor = 'var(--accent)';

                    if (!TITLE_INPUT.value && info.original_filename) {
                        TITLE_INPUT.value = info.original_filename.replace(/[-_]/g, ' ');
                    }

                    extractExifFromUrl(info.secure_url);
                }
            });
        });

        function extractExifFromUrl(url) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                EXIF.getData(img, function() {
                    const allTags = EXIF.getAllTags(this);
                    extractedExif = {};

                    const make = allTags.Make || '';
                    const model = allTags.Model || '';
                    if (make || model) extractedExif.camera = (make + ' ' + model).trim();

                    const dateTaken = allTags.DateTimeOriginal || allTags.DateTime;
                    if (dateTaken) extractedExif.date = String(dateTaken).replace(/:/g, '-').split(' ')[0];

                    if (allTags.PixelXDimension && allTags.PixelYDimension) {
                        extractedExif.size = `${allTags.PixelXDimension} × ${allTags.PixelYDimension}`;
                    }
                    if (allTags.ISOSpeedRatings) extractedExif.iso = 'ISO ' + allTags.ISOSpeedRatings;
                    if (allTags.FNumber) extractedExif.aperture = 'ƒ/' + allTags.FNumber;
                    if (allTags.ExposureTime) {
                        const exp = allTags.ExposureTime;
                        extractedExif.exposure = exp < 1 ? '1/' + Math.round(1/exp) + 's' : exp + 's';
                    }
                    if (allTags.FocalLength) extractedExif.focal = allTags.FocalLength + 'mm';
                    if (allTags.LensModel) extractedExif.lens = allTags.LensModel;

                    displayExifData(extractedExif);
                });
            };
            img.src = url;
        }

        function displayExifData(exif) {
            if (!exif) return;
            let html = '<div class="exif-grid">';
            const fields = [
                ['Cámara', exif.camera],
                ['Fecha', exif.date],
                ['Tamaño', exif.size],
                ['ISO', exif.iso],
                ['Apertura', exif.aperture],
                ['Exposición', exif.exposure],
                ['Focal', exif.focal],
                ['Lente', exif.lens]
            ];
            fields.forEach(([label, value]) => {
                if (value) html += `<div class="exif-item"><span class="exif-label">${label}</span><span class="exif-value">${value}</span></div>`;
            });
            html += '</div>';
            EXIF_DISPLAY.innerHTML = html;
            EXIF_GROUP.style.display = 'block';
        }

        SUBMIT_BTN.addEventListener('click', async function() {
            const url = UPLOADED_URL.value;
            if (!url) {
                RESULT.innerHTML = '<div class="result error"><strong>Sube una foto primero</strong></div>';
                RESULT.style.display = 'block';
                return;
            }

            const githubToken = localStorage.getItem('fotoblog_github_token');
            if (!githubToken) {
                RESULT.innerHTML = '<div class="result error"><strong>Configura tu GitHub Token primero</strong></div>';
                RESULT.style.display = 'block';
                return;
            }

            SUBMIT_BTN.disabled = true;
            SUBMIT_BTN.textContent = 'Publicando...';
            RESULT.style.display = 'none';

            try {
                // Get current rolls.json
                const getRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data/rolls.json`, {
                    headers: { 'Authorization': 'token ' + githubToken }
                });

                if (getRes.status === 404) throw new Error('No se encontró rolls.json');
                if (getRes.status === 401) {
                    localStorage.removeItem('fotoblog_github_token');
                    throw new Error('Token inválido. Vuelve a introducirlo.');
                }

                const currentFile = await getRes.json();
                const currentSha = currentFile.sha;
                const currentContent = decodeURIComponent(escape(atob(currentFile.content)));
                const rollsData = JSON.parse(currentContent);

                // Build new photo entry
                const title = TITLE_INPUT.value || 'Sin título';
                const rollId = ROLL_ID.value || '001';
                const dayNum = DAY_NUMBER.value || '001';
                const photoNum = PHOTO_NUMBER.value || '01';

                const newPhoto = {
                    id: `${rollId}-${photoNum}`,
                    filename: url,
                    title: title,
                    notes: NOTES.value || '',
                    day_number: dayNum,
                    photo_number: photoNum
                };

                if (extractedExif && Object.keys(extractedExif).length > 0) {
                    newPhoto.exif = {};
                    if (extractedExif.camera) newPhoto.exif.camera = extractedExif.camera;
                    if (extractedExif.date) newPhoto.exif.date = extractedExif.date;
                    if (extractedExif.size) newPhoto.exif.size = extractedExif.size;
                    if (extractedExif.iso) newPhoto.exif.iso = extractedExif.iso;
                    if (extractedExif.aperture) newPhoto.exif.aperture = extractedExif.aperture;
                    if (extractedExif.exposure) newPhoto.exif.exposure = extractedExif.exposure;
                    if (extractedExif.focal) newPhoto.exif.focalLength = extractedExif.focal;
                    if (extractedExif.lens) newPhoto.exif.lens = extractedExif.lens;
                }

                // Find or create roll
                let targetRoll = rollsData.rolls.find(r => r.id === rollId);
                if (!targetRoll) {
                    const rollName = document.getElementById('roll-name').value || 'Nuevo Roll ' + rollId;
                    targetRoll = {
                        id: rollId,
                        name: rollName,
                        description: '',
                        location: '',
                        camera: extractedExif?.camera || '',
                        date: new Date().toISOString().split('T')[0],
                        photos: []
                    };
                    rollsData.rolls.push(targetRoll);
                }

                // Always add as new photo (don't replace)
                // Generate unique ID if needed
                let finalId = newPhoto.id;
                let counter = 1;
                while (targetRoll.photos.some(p => p.id === finalId)) {
                    finalId = `${rollId}-${String(counter).padStart(2, '0')}`;
                    counter++;
                }
                newPhoto.id = finalId;
                targetRoll.photos.push(newPhoto);

                targetRoll.photos.sort((a, b) => parseInt(a.photo_number) - parseInt(b.photo_number));

                // Write to GitHub
                const newContent = JSON.stringify(rollsData, null, 2);
                // UTF-8 safe base64 encoding
                const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

                const putRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/data/rolls.json`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': 'token ' + githubToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Nueva foto: ' + title,
                        content: encodedContent,
                        sha: currentSha,
                        branch: GITHUB_BRANCH
                    })
                });

                if (putRes.ok) {
                    RESULT.innerHTML = '<div class="result success"><strong>✅ ¡Publicado!</strong><br>GitHub Pages se actualizará en ~2 minutos.</div>';
                    RESULT.style.display = 'block';
                    UPLOADED_URL.value = '';
                    TITLE_INPUT.value = '';
                    ROLL_ID.value = '';
                    document.getElementById('roll-name').value = '';
                    DAY_NUMBER.value = '';
                    PHOTO_NUMBER.value = '';
                    NOTES.value = '';
                    DROPZONE.querySelector('p').textContent = 'Selecciona una foto para subir';
                    DROPZONE.style.borderColor = '';
                    EXIF_GROUP.style.display = 'none';
                    extractedExif = null;
                } else {
                    const errData = await putRes.json();
                    throw new Error(errData.message || 'Error al guardar');
                }

            } catch (err) {
                RESULT.innerHTML = '<div class="result error"><strong>Error: ' + err.message + '</strong></div>';
                RESULT.style.display = 'block';
            }

            SUBMIT_BTN.disabled = false;
            SUBMIT_BTN.textContent = 'Publicar en el Blog';
        });
    </script>
</body>
</html>
