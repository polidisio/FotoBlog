<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Foto — FotoBlog de Jose</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="./" class="logo">Foto<span>Blog</span></a>
            <p class="tagline">Cada foto cuenta una historia del pasado</p>
            <nav class="nav-links">
                <a href="./" class="nav-link">🏠 Inicio</a>
                <a href="./roll.html" class="nav-link">🎞️ Rollos</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="upload-container">
            <h1 class="upload-title">Nueva Exposición</h1>
            <p class="upload-subtitle">Añade una foto a tu colección analógica</p>

            <div class="upload-form">
                <div class="form-group">
                    <label>Negativo / Foto</label>
                    <div class="file-drop" id="dropZone">
                        <div class="icon">📷</div>
                        <p>Selecciona una foto para subir</p>
                    </div>
                    <input type="hidden" id="uploaded-url">
                    <input type="hidden" id="uploaded-filename">
                </div>

                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" placeholder="Nombre de la exposición">
                </div>

                <div class="form-group">
                    <label for="roll-id">ID del Roll</label>
                    <input type="text" id="roll-id" placeholder="001">
                </div>

                <div class="form-group">
                    <label for="day-number">Day #</label>
                    <input type="text" id="day-number" placeholder="001">
                </div>

                <div class="form-group">
                    <label for="photo-number">Foto #</label>
                    <input type="text" id="photo-number" placeholder="01">
                </div>

                <div class="form-group">
                    <label for="notes">Notas</label>
                    <textarea id="notes" placeholder="Notas sobre esta exposición..."></textarea>
                </div>

                <div class="form-group" id="exif-group" style="display: none;">
                    <label>Datos EXIF</label>
                    <div id="exif-display" class="exif-data"></div>
                </div>

                <button type="button" class="btn" id="submitBtn">Generar JSON</button>
                <div id="uploadResult"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-seal">
            <span>FotoBlog<br>Jose · 2026</span>
        </div>
        <p class="footer-copyright">Cada foto cuenta una historia del pasado</p>
    </footer>

    <script src="//upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <script>
        const CLOUD_NAME = 'dk3t3fas3';
        const UPLOAD_PRESET = 'fotoblog_unsigned';
        const DROPZONE = document.getElementById('dropZone');
        const UPLOADED_URL = document.getElementById('uploaded-url');
        const UPLOADED_FILENAME = document.getElementById('uploaded-filename');
        const TITLE_INPUT = document.getElementById('title');
        const ROLL_ID = document.getElementById('roll-id');
        const DAY_NUMBER = document.getElementById('day-number');
        const PHOTO_NUMBER = document.getElementById('photo-number');
        const NOTES = document.getElementById('notes');
        const SUBMIT_BTN = document.getElementById('submitBtn');
        const RESULT = document.getElementById('uploadResult');
        const EXIF_GROUP = document.getElementById('exif-group');
        const EXIF_DISPLAY = document.getElementById('exif-display');

        let uploadedInfo = null;
        let extractedExif = null;

        // Open Cloudinary widget on click
        DROPZONE.addEventListener('click', function() {
            cloudinary.openUploadWidget({
                cloud_name: CLOUD_NAME,
                upload_preset: UPLOAD_PRESET,
                sources: ['local', 'camera'],
                multiple: false,
                cropping: false,
                folder: 'fotoblog',
                show_exif: true,
                styles: {
                    palette: {
                        window: "#2D1B0E",
                        windowBorder: "#C4704A",
                        tabIcon: "#C4704A",
                        menuIcons: "#C4704A",
                        textDark: "#F5EDE0",
                        textLight: "#F5EDE0",
                        link: "#C4704A",
                        action: "#C4704A",
                        inactiveTabIcon: "#A89888",
                        error: "#C4704A",
                        inProgress: "#C4704A",
                        complete: "#8B9A7D",
                        sourceBg: "#1A0F08"
                    }
                }
            }, function(error, result) {
                console.log('Widget callback:', error, result);
                if (error) {
                    console.error('Upload error:', error);
                    RESULT.innerHTML = '<div class="result error"><strong>Error: ' + error.message + '</strong></div>';
                    RESULT.style.display = 'block';
                    return;
                }
                if (result && result.event === 'success') {
                    const info = result.info;
                    uploadedInfo = info;
                    UPLOADED_URL.value = info.secure_url;

                    DROPZONE.querySelector('p').textContent = '✅ ¡Foto subida! ' + info.original_filename;
                    DROPZONE.style.borderColor = 'var(--accent)';

                    // Show EXIF data if available from Cloudinary
                    console.log('Cloudinary info:', info);
                    if (info.exif) {
                        console.log('EXIF from Cloudinary:', info.exif);
                    }

                    // Auto-fill title from filename if empty
                    if (!TITLE_INPUT.value && info.original_filename) {
                        TITLE_INPUT.value = info.original_filename.replace(/[-_]/g, ' ');
                    }

                    // Auto-fill day from Cloudinary's created_at
                    if (info.created_at && !DAY_NUMBER.value) {
                        const date = new Date(info.created_at);
                        DAY_NUMBER.value = String(date.getDate()).padStart(2, '0');
                    }

                    // Try to extract EXIF client-side as backup
                    extractExifFromUrl(info.secure_url);
                }
                if (result && result.event === 'close') {
                    console.log('Widget closed');
                }
            });
        });

        // Extract EXIF from uploaded image
        function extractExifFromUrl(url) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = function() {
                EXIF.getData(img, function() {
                    const allTags = EXIF.getAllTags(this);
                    console.log('EXIF data:', allTags);

                    // Build EXIF object for display
                    extractedExif = {};

                    // Camera
                    const make = allTags.Make || '';
                    const model = allTags.Model || '';
                    if (make || model) {
                        extractedExif.camera = (make + ' ' + model).trim();
                    }

                    // Date taken
                    const dateTaken = allTags.DateTimeOriginal || allTags.DateTime;
                    if (dateTaken) {
                        extractedExif.date = String(dateTaken).replace(/:/g, '-').split(' ')[0];
                    }

                    // Size
                    if (allTags.PixelXDimension && allTags.PixelYDimension) {
                        extractedExif.size = `${allTags.PixelXDimension} × ${allTags.PixelYDimension}`;
                    }

                    // ISO
                    if (allTags.ISOSpeedRatings) {
                        extractedExif.iso = 'ISO ' + allTags.ISOSpeedRatings;
                    }

                    // Aperture
                    if (allTags.FNumber) {
                        extractedExif.aperture = 'ƒ/' + allTags.FNumber;
                    }

                    // Exposure
                    if (allTags.ExposureTime) {
                        const exp = allTags.ExposureTime;
                        if (exp < 1) {
                            extractedExif.exposure = '1/' + Math.round(1/exp) + 's';
                        } else {
                            extractedExif.exposure = exp + 's';
                        }
                    }

                    // Focal length
                    if (allTags.FocalLength) {
                        extractedExif.focal = allTags.FocalLength + 'mm';
                    }

                    // Lens
                    if (allTags.LensModel) {
                        extractedExif.lens = allTags.LensModel;
                    }

                    // Display EXIF
                    displayExifData(extractedExif);

                    // Auto-fill day from EXIF date if available
                    if (dateTaken && !DAY_NUMBER.value) {
                        const parts = String(dateTaken).match(/(\d{4}):(\d{2}):(\d{2})/);
                        if (parts) {
                            DAY_NUMBER.value = parts[2] + parts[3];
                        }
                    }
                });
            };
            img.onerror = function() {
                console.log('Could not load image for EXIF extraction');
            };
            img.src = url;
        }

        function displayExifData(exif) {
            if (!exif) return;

            let html = '<div class="exif-grid">';

            if (exif.camera) {
                html += `<div class="exif-item"><span class="exif-label">Cámara</span><span class="exif-value">${exif.camera}</span></div>`;
            }
            if (exif.date) {
                html += `<div class="exif-item"><span class="exif-label">Fecha</span><span class="exif-value">${exif.date}</span></div>`;
            }
            if (exif.size) {
                html += `<div class="exif-item"><span class="exif-label">Tamaño</span><span class="exif-value">${exif.size}</span></div>`;
            }
            if (exif.iso) {
                html += `<div class="exif-item"><span class="exif-label">ISO</span><span class="exif-value">${exif.iso}</span></div>`;
            }
            if (exif.aperture) {
                html += `<div class="exif-item"><span class="exif-label">Apertura</span><span class="exif-value">${exif.aperture}</span></div>`;
            }
            if (exif.exposure) {
                html += `<div class="exif-item"><span class="exif-label">Exposición</span><span class="exif-value">${exif.exposure}</span></div>`;
            }
            if (exif.focal) {
                html += `<div class="exif-item"><span class="exif-label">Focal</span><span class="exif-value">${exif.focal}</span></div>`;
            }
            if (exif.lens) {
                html += `<div class="exif-item"><span class="exif-label">Lente</span><span class="exif-value">${exif.lens}</span></div>`;
            }

            html += '</div>';

            EXIF_DISPLAY.innerHTML = html;
            EXIF_GROUP.style.display = 'block';
        }

        SUBMIT_BTN.addEventListener('click', function() {
            const url = UPLOADED_URL.value;
            if (!url) {
                RESULT.innerHTML = '<div class="result error"><strong>Selecciona y sube una foto primero</strong></div>';
                RESULT.style.display = 'block';
                return;
            }

            const title = TITLE_INPUT.value || 'Sin título';
            const rollId = ROLL_ID.value || '001';
            const dayNum = DAY_NUMBER.value || '001';
            const photoNum = PHOTO_NUMBER.value || '01';
            const notesVal = NOTES.value || '';

            // Build EXIF object for JSON if available
            let exifObj = null;
            if (extractedExif && Object.keys(extractedExif).length > 0) {
                exifObj = {};
                if (extractedExif.camera) exifObj.camera = extractedExif.camera;
                if (extractedExif.date) exifObj.date = extractedExif.date;
                if (extractedExif.size) exifObj.size = extractedExif.size;
                if (extractedExif.iso) exifObj.iso = extractedExif.iso;
                if (extractedExif.aperture) exifObj.aperture = extractedExif.aperture;
                if (extractedExif.exposure) exifObj.exposure = extractedExif.exposure;
                if (extractedExif.focal) exifObj.focalLength = extractedExif.focal;
                if (extractedExif.lens) exifObj.lens = extractedExif.lens;
            }

            const entry = {
                id: `${rollId}-${photoNum}`,
                filename: url,
                title: title,
                notes: notesVal,
                day_number: dayNum,
                photo_number: photoNum
            };

            if (exifObj) {
                entry.exif = exifObj;
            }

            const jsonSnippet = JSON.stringify(entry, null, 2);

            RESULT.innerHTML = `
                <div class="result success">
                    <strong>✅ ¡JSON generado!</strong><br><br>
                    <strong>📋 Añádelo al rollo en data/rolls.json:</strong>
                    <div class="json-snippet">${escapeHtml(jsonSnippet)}</div>
                    <button type="button" class="copy-btn" id="copyBtn">Copiar al portapapeles</button>
                </div>
            `;
            RESULT.style.display = 'block';

            // Attach copy handler after adding to DOM
            setTimeout(() => {
                const copyBtnEl = document.getElementById('copyBtn');
                if (copyBtnEl) {
                    copyBtnEl.addEventListener('click', function() {
                        copyToClipboard(this, jsonSnippet);
                    });
                }
            }, 100);
        });

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '¡Copiado!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copiar al portapapeles';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '¡Copiado!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copiar al portapapeles';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
