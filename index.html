<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoBlog de Jose — Análogos & Vintage</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <a href="./" class="logo">Foto<span>Blog</span></a>
            <p class="tagline">Cada foto cuenta una historia del pasado</p>
            <nav class="nav-links">
                <a href="./" class="nav-link">🏠 Inicio</a>
                <a href="./roll.html" class="nav-link">🎞️ Rollos</a>
            </nav>
            <div class="year-filter">
                <label for="year-filter">Año:</label>
                <select id="year-filter">
                    <option value="all">Todos los años</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" id="hero-section">
            <div class="hero-polaroid">
                <img src="https://res.cloudinary.com/dk3t3fas3/image/upload/v1774450452/fotoblog/dcuvabzx9nj3etituc9r.jpg" alt="Un pequeño trozo de Egipto en Madrid" id="hero-img">
                <div class="hero-label">
                    <div class="hero-day" id="hero-day">Day 001</div>
                    <h2 class="hero-title" id="hero-title">Un pequeño trozo de Egipto en Madrid</h2>
                    <p class="hero-meta" id="hero-meta">Madrid, España · iPhone</p>
                </div>
            </div>
        </section>

        <section class="section-header">
            <h2>Rollos</h2>
            <p>Historias capturadas en carrete</p>
        </section>

        <div id="rolls-container">
            <div class="empty-state">
                <div class="icon">📷</div>
                <h2>Cargando...</h2>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-seal">
            <span>FotoBlog<br>Jose · 2026</span>
        </div>
        <p class="footer-copyright">Cada foto cuenta una historia del pasado</p>
    </footer>

    <script src="./app.js"></script>
</body>
</html>
